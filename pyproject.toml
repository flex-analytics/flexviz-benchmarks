[project]
name = "flexviz-benchmarks"
version = "0.1.0"
description = "Benchmarking FlexViz against other tools"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.3",
    "duckdb-server>=0.26.0",
    "flexviz",
    "numpy>=2.4.6",
    "playwright>=1.52.0",
    "psutil>=6.0.0",
    "plotly>=5.0.0",
    "polars>=1.40.1",
    "pyarrow>=16.0.0",
    "vaex-core>=4.19.0",
    "datashader>=0.16",
    "matplotlib>=3.9",
    "pillow>=10.0",
    "perspective-python==3.1.3",
    "tornado>=6.4",
]

[tool.uv.sources]
flexviz = { path = "../flexviz", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["benchmarks"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
# E501 line too long — formatter handles this, linter warning is redundant
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
